repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude --config pyproject.toml
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --config pyproject.toml
        language: system
        types_or: [python, pyi, markdown]

      - id: ty-check
        name: ty check
        entry: uv run ty check --output-format concise --no-progress .
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: dashboard-format
        name: dashboard prettier
        entry: pnpm --dir dashboard format
        language: system
        types_or: [ts, tsx, css, html, json, yaml, markdown]
        files: ^dashboard/
        pass_filenames: false

      - id: dashboard-lint
        name: dashboard eslint
        entry: pnpm --dir dashboard lint
        language: system
        types_or: [ts, tsx]
        files: ^dashboard/
        pass_filenames: false

      - id: dashboard-typecheck
        name: dashboard typecheck
        entry: pnpm --dir dashboard typecheck
        language: system
        types_or: [ts, tsx]
        files: ^dashboard/
        pass_filenames: false

      - id: dashboard-build
        name: dashboard build
        entry: pnpm --dir dashboard build
        language: system
        files: ^dashboard/
        pass_filenames: false
