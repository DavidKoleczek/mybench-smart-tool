[project]
name = "mybench"
version = "0.1.0"
description = "MyBench Smart Tool Library"
readme = "README.md"
authors = [
    { name = "David Koleczek", email = "45405824+DavidKoleczek@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0,<8.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "github-copilot-sdk>=1.0.11,<2.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-liquid>=2.3.1,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.1,<0.28.0",
    "uvicorn>=0.52.4,<0.53.0",
]

[project.scripts]
mybench = "mybench.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[dependency-groups]
dev = [
    "httpx2>=2.12.0,<3.0.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.71",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
